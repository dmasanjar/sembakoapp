<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Awake Admin - Complete Management</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--pg:#f4f6f0;--tx:#1a1a1a;--sub:#707670;--green:#2e7d32;--red:#dc1f26;--blue:#1976d2;--border:#e0e4dc;--card:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--pg);color:var(--tx);font-family:'Plus Jakarta Sans',system-ui,sans-serif;margin:0;padding:0;min-height:100vh}
header{background:#fff;border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{font-weight:800;font-size:18px;color:var(--green);display:flex;align-items:center;gap:8px}
.nav-tabs{display:flex;gap:8px;background:#eef2ea;padding:4px;border-radius:12px;flex-wrap:wrap}
.nav-tabs button{border:0;background:transparent;padding:8px 14px;border-radius:8px;font-weight:600;font-size:13px;color:var(--sub);cursor:pointer;transition:.2s}
.nav-tabs button.on{background:#fff;color:var(--tx);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.main{max-width:1200px;margin:24px auto;padding:0 16px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.card small{color:var(--sub);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.card .val{font-size:26px;font-weight:800;color:var(--tx);margin-top:6px}
.table-card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.04);margin-bottom:24px}
.table-header{padding:16px 20px;border-bottom:1px solid var(--border);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:space-between}
table{width:100%;border-collapse:collapse;text-align:left;font-size:14px}
th{background:#f9fbf7;color:var(--sub);font-weight:600;padding:12px 16px;border-bottom:1px solid var(--border)}
td{padding:14px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:0}
.badge{display:inline-flex;align-items:center;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700}
.badge.pending{background:#fff3cd;color:#856404}
.badge.preparing{background:#cce5ff;color:#004085}
.badge.delivery{background:#d4edda;color:#155724}
.badge.finished{background:#d1e7dd;color:#0f5132}
.badge.cancelled{background:#f8d7da;color:#721c24}
button.btn{background:var(--green);color:#fff;border:0;padding:6px 14px;border-radius:8px;font-weight:600;font-size:12px;cursor:pointer}
button.btn.danger{background:var(--red)}
button.btn.blue{background:var(--blue)}
button.btn.secondary{background:#eef2ea;color:var(--tx)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;display:none}
.modal-content{background:#fff;width:100%;max-width:500px;border-radius:20px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--sub)}
.form-group input, .form-group select{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:10px;font-size:14px;outline:none}
.toast{position:fixed;bottom:24px;right:24px;background:#1a1a1a;color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.2);display:none;z-index:2000}
</style>
</head>
<body>
<header>
  <div class="logo">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="var(--green)"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    Awake Admin - Complete CRUD
  </div>
  <div class="nav-tabs">
    <button class="on" onclick="switchTab('orders')">Orders</button>
    <button onclick="switchTab('topup')">Top Up</button>
    <button onclick="switchTab('products')">Products CRUD</button>
    <button onclick="switchTab('drivers')">Drivers CRUD</button>
  </div>
</header>

<div class="main">
  <div class="grid4">
    <div class="card"><small>Total Orders</small><div class="val" id="stat-orders">0</div></div>
    <div class="card"><small>Pending Top Up</small><div class="val" id="stat-topup" style="color:var(--red)">0</div></div>
    <div class="card"><small>Total Products</small><div class="val" id="stat-products">0</div></div>
    <div class="card"><small>Active Drivers</small><div class="val" id="stat-drivers" style="color:var(--blue)">0</div></div>
  </div>

  <div class="table-card">
    <div class="table-header">
      <span id="table-title">Manage Orders</span>
      <div id="header-action"></div>
    </div>
    <div id="table-content"></div>
  </div>
</div>

<!-- Modal Form -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h3 id="modal-title" style="margin-top:0;margin-bottom:16px">Form</h3>
    <div id="modal-body"></div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:20px">
      <button class="btn secondary" onclick="closeModal()">Cancel</button>
      <button class="btn" id="modal-save" onclick="saveModalData()">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">Saved successfully</div>

<script>
const SK="awake_ui_v2";
let db={orders:[], txs:[], wallet:0, products:[], drivers:[{id:1,name:"Budi Santoso",phone:"08123456789",plat:"D 1234 ABC"},{id:2,name:"Joko Widodo",phone:"08987654321",plat:"D 5678 XYZ"}]};

function loadData(){
  try{
    const d=JSON.parse(localStorage.getItem(SK)||"null");
    if(d){
      db.orders=d.orders||[];
      db.txs=d.txs||[];
      db.wallet=d.wallet||0;
      db.products=d.products||[
        {id:1,name:"Beras Premium 5kg",u:72000,cat:"Beras",stock:50},
        {id:2,name:"Minyak Goreng 1L",u:18000,cat:"Minyak",stock:40},
        {id:3,name:"Gula Pasir 1kg",u:16000,cat:"Bumbu",stock:60}
      ];
      db.drivers=d.drivers||db.drivers;
    }
  }catch(e){console.error(e);}
}

function saveData(){
  try{
    const d=JSON.parse(localStorage.getItem(SK)||"{}");
    d.orders=db.orders;
    d.txs=db.txs;
    d.wallet=db.wallet;
    d.products=db.products;
    d.drivers=db.drivers;
    localStorage.setItem(SK, JSON.stringify(d));
    showToast("Changes saved successfully");
  }catch(e){console.error(e);}
}

function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;
  t.style.display="block";
  setTimeout(()=>t.style.display="none", 2000);
}

let currentTab="orders";
function switchTab(t){
  currentTab=t;
  document.querySelectorAll(".nav-tabs button").forEach(b=>b.classList.toggle("on", b.textContent.toLowerCase().includes(t)));
  render();
}

function render(){
  loadData();
  document.getElementById("stat-orders").textContent=db.orders.length;
  document.getElementById("stat-topup").textContent=db.txs.filter(t=>t.k=="topup"&&t.st=="pending").length;
  document.getElementById("stat-products").textContent=db.products.length;
  document.getElementById("stat-drivers").textContent=db.drivers.length;

  const headerAction=document.getElementById("header-action");
  headerAction.innerHTML="";

  if(currentTab=="orders"){
    document.getElementById("table-title").textContent="All Customer Orders";
    headerAction.innerHTML=`<button class="btn blue" onclick="openOrderModal()">+ Create Order</button>`;
    if(!db.orders.length){
      document.getElementById("table-content").innerHTML=`<div style="padding:40px;text-align:center;color:var(--sub)">No orders found</div>`;
      return;
    }
    let html=`<table><thead><tr><th>Order ID</th><th>Cafe</th><th>Status</th><th>Total</th><th>Date</th><th>Actions</th></tr></thead><tbody>`;
    db.orders.forEach((o, idx)=>{
      const tot=(o.items||[]).reduce((a,c)=>a+c.u*c.q,0)+3000;
      html+=`<tr>
        <td><b>${o.id}</b></td>
        <td>${o.cafe||'-'}</td>
        <td><span class="badge ${o.st=='in delivery'?'delivery':o.st}">${o.st}</span></td>
        <td>IDR ${tot.toLocaleString('id-ID')}</td>
        <td>${o.date||'-'}</td>
        <td>
          ${o.st=='pending'?`<button class="btn" onclick="updateOrderStatus(${idx}, 'preparing')">Approve</button> <button class="btn danger" onclick="updateOrderStatus(${idx}, 'cancelled')">Cancel</button>`:''}
          ${o.st=='preparing'?`<button class="btn" onclick="updateOrderStatus(${idx}, 'in delivery')">Deliver</button>`:''}
          ${o.st=='in delivery'?`<button class="btn" onclick="updateOrderStatus(${idx}, 'finished')">Complete</button>`:''}
          <button class="btn secondary" onclick="editOrder(${idx})">Edit</button>
          <button class="btn danger" onclick="deleteOrder(${idx})">Delete</button>
        </td>
      </tr>`;
    });
    html+=`</tbody></table>`;
    document.getElementById("table-content").innerHTML=html;

  } else if(currentTab=="topup"){
    document.getElementById("table-title").textContent="Wallet Top Up Requests";
    const tu=db.txs.filter(t=>t.k=="topup");
    if(!tu.length){
      document.getElementById("table-content").innerHTML=`<div style="padding:40px;text-align:center;color:var(--sub)">No top up requests</div>`;
      return;
    }
    let html=`<table><thead><tr><th>Date</th><th>Amount</th><th>Status</th><th>Actions</th></tr></thead><tbody>`;
    tu.forEach((t, i)=>{
      const realIdx=db.txs.findIndex(x=>x==t);
      html+=`<tr>
        <td>${t.date} ${t.time}</td>
        <td><b>IDR ${(t.amt||0).toLocaleString('id-ID')}</b></td>
        <td><span class="badge ${t.st=='done'?'finished':'pending'}">${t.st}</span></td>
        <td>
          ${t.st=='pending'?`<button class="btn" onclick="approveTopup(${realIdx})">Approve Topup</button>`:`<span style="color:var(--sub);font-size:12px">Approved</span>`}
          <button class="btn danger" onclick="deleteTopup(${realIdx})">Delete</button>
        </td>
      </tr>`;
    });
    html+=`</tbody></table>`;
    document.getElementById("table-content").innerHTML=html;

  } else if(currentTab=="products"){
    document.getElementById("table-title").textContent="Product Catalog Management";
    headerAction.innerHTML=`<button class="btn" onclick="openProductModal()">+ Add Product</button>`;
    if(!db.products.length){
      document.getElementById("table-content").innerHTML=`<div style="padding:40px;text-align:center;color:var(--sub)">No products found</div>`;
      return;
    }
    let html=`<table><thead><tr><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Actions</th></tr></thead><tbody>`;
    db.products.forEach((p, idx)=>{
      html+=`<tr>
        <td><b>${p.name}</b></td>
        <td>${p.cat}</td>
        <td>IDR ${Number(p.u).toLocaleString('id-ID')}</td>
        <td>${p.stock||100} pcs</td>
        <td>
          <button class="btn secondary" onclick="editProduct(${idx})">Edit</button>
          <button class="btn danger" onclick="deleteProduct(${idx})">Delete</button>
        </td>
      </tr>`;
    });
    html+=`</tbody></table>`;
    document.getElementById("table-content").innerHTML=html;

  } else if(currentTab=="drivers"){
    document.getElementById("table-title").textContent="Driver Management";
    headerAction.innerHTML=`<button class="btn blue" onclick="openDriverModal()">+ Add Driver</button>`;
    if(!db.drivers.length){
      document.getElementById("table-content").innerHTML=`<div style="padding:40px;text-align:center;color:var(--sub)">No drivers found</div>`;
      return;
    }
    let html=`<table><thead><tr><th>Driver Name</th><th>Phone</th><th>Vehicle Plate</th><th>Actions</th></tr></thead><tbody>`;
    db.drivers.forEach((d, idx)=>{
      html+=`<tr>
        <td><b>${d.name}</b></td>
        <td>${d.phone}</td>
        <td>${d.plat}</td>
        <td>
          <button class="btn secondary" onclick="editDriver(${idx})">Edit</button>
          <button class="btn danger" onclick="deleteDriver(${idx})">Delete</button>
        </td>
      </tr>`;
    });
    html+=`</tbody></table>`;
    document.getElementById("table-content").innerHTML=html;
  }
}

// Order CRUD
function updateOrderStatus(idx, st){
  db.orders[idx].st=st;
  saveData();
  render();
}
function deleteOrder(idx){
  if(confirm("Delete this order?")){
    db.orders.splice(idx,1);
    saveData();
    render();
  }
}
let editOrderIdx=-1;
function openOrderModal(idx=-1){
  editOrderIdx=idx;
  const o=idx>=0?db.orders[idx]:{id:"#AWK0"+Math.floor(Math.random()*90000+10000),cafe:"Awake Sembako Central",st:"pending",items:[{n:"Beras Premium 5kg",u:72000,q:1}],date:"2 Nov 2026"};
  document.getElementById("modal-title").textContent=idx>=0?"Edit Order":"Create New Order";
  document.getElementById("modal-body").innerHTML=`
    <div class="form-group"><label>Order ID</label><input id="f-oid" value="${o.id}"></div>
    <div class="form-group"><label>Store / Cafe</label><input id="f-ocafe" value="${o.cafe}"></div>
    <div class="form-group"><label>Status</label>
      <select id="f-ost">
        <option value="pending" ${o.st=='pending'?'selected':''}>Pending</option>
        <option value="preparing" ${o.st=='preparing'?'selected':''}>Preparing</option>
        <option value="in delivery" ${o.st=='in delivery'?'selected':''}>In Delivery</option>
        <option value="finished" ${o.st=='finished'?'selected':''}>Finished</option>
        <option value="cancelled" ${o.st=='cancelled'?'selected':''}>Cancelled</option>
      </select>
    </div>
  `;
  document.getElementById("modal").style.display="flex";
}

// Product CRUD
let editProdIdx=-1;
function openProductModal(idx=-1){
  editProdIdx=idx;
  const p=idx>=0?db.products[idx]:{name:"",cat:"Beras",u:10000,stock:50};
  document.getElementById("modal-title").textContent=idx>=0?"Edit Product":"Add Product";
  document.getElementById("modal-body").innerHTML=`
    <div class="form-group"><label>Product Name</label><input id="f-pname" value="${p.name}"></div>
    <div class="form-group"><label>Category</label><input id="f-pcat" value="${p.cat}"></div>
    <div class="form-group"><label>Price (IDR)</label><input type="number" id="f-pu" value="${p.u}"></div>
    <div class="form-group"><label>Stock</label><input type="number" id="f-pstock" value="${p.stock||100}"></div>
  `;
  document.getElementById("modal").style.display="flex";
}
function editProduct(idx){openProductModal(idx);}
function deleteProduct(idx){
  if(confirm("Delete product?")){
    db.products.splice(idx,1);
    saveData();
    render();
  }
}

// Driver CRUD
let editDrvIdx=-1;
function openDriverModal(idx=-1){
  editDrvIdx=idx;
  const d=idx>=0?db.drivers[idx]:{name:"",phone:"",plat:""};
  document.getElementById("modal-title").textContent=idx>=0?"Edit Driver":"Add Driver";
  document.getElementById("modal-body").innerHTML=`
    <div class="form-group"><label>Driver Name</label><input id="f-dname" value="${d.name}"></div>
    <div class="form-group"><label>Phone Number</label><input id="f-dphone" value="${d.phone}"></div>
    <div class="form-group"><label>Vehicle Plate</label><input id="f-dplat" value="${d.plat}"></div>
  `;
  document.getElementById("modal").style.display="flex";
}
function editDriver(idx){openDriverModal(idx);}
function deleteDriver(idx){
  if(confirm("Delete driver?")){
    db.drivers.splice(idx,1);
    saveData();
    render();
  }
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

function saveModalData(){
  if(currentTab=="orders"){
    const id=document.getElementById("f-oid").value;
    const cafe=document.getElementById("f-ocafe").value;
    const st=document.getElementById("f-ost").value;
    if(editOrderIdx>=0){
      db.orders[editOrderIdx].id=id;
      db.orders[editOrderIdx].cafe=cafe;
      db.orders[editOrderIdx].st=st;
    } else {
      db.orders.unshift({id, cafe, st, items:[{n:"Beras Premium 5kg",u:72000,q:2}], date:"2 Nov 2026"});
    }
  } else if(currentTab=="products"){
    const name=document.getElementById("f-pname").value;
    const cat=document.getElementById("f-pcat").value;
    const u=Number(document.getElementById("f-pu").value);
    const stock=Number(document.getElementById("f-pstock").value);
    if(editProdIdx>=0){
      db.products[editProdIdx]={name, cat, u, stock};
    } else {
      db.products.push({name, cat, u, stock});
    }
  } else if(currentTab=="drivers"){
    const name=document.getElementById("f-dname").value;
    const phone=document.getElementById("f-dphone").value;
    const plat=document.getElementById("f-dplat").value;
    if(editDrvIdx>=0){
      db.drivers[editDrvIdx]={name, phone, plat};
    } else {
      db.drivers.push({name, phone, plat});
    }
  }
  saveData();
  closeModal();
  render();
}

function approveTopup(idx){
  db.txs[idx].st="done";
  db.wallet+=(db.txs[idx].amt||0);
  saveData();
  render();
}
function deleteTopup(idx){
  db.txs.splice(idx,1);
  saveData();
  render();
}

render();
window.addEventListener('storage', render);
</script>
</body>
</html>
